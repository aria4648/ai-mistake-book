<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 错题本</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 登录/注册页面 -->
    <div id="loginPage" class="login-box">
        <h2>AI 错题本</h2>
        <div id="loginForm">
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="login()">登录</button>
            <p class="switch" onclick="showRegister()">还没有账号？去注册</p>
        </div>
        <div id="registerForm" class="hidden">
            <input type="text" id="regUsername" placeholder="用户名">
            <input type="password" id="regPassword" placeholder="密码">
            <input type="text" id="regNickname" placeholder="昵称（可选）">
            <button onclick="register()">注册</button>
            <p class="switch" onclick="showLogin()">已有账号？去登录</p>
        </div>
    </div>

    <!-- 主页面（登录后显示） -->
    <div id="mainPage" class="container hidden">
        <div class="header">
            <h1>📚 AI 错题本</h1>
            <div>
                <span id="welcomeMsg">欢迎</span>
                <button onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 新增错题 -->
        <div class="add-box">
            <h3>➕ 添加新错题</h3>
            <input type="text" id="title" placeholder="题目">
            <input type="text" id="myAnswer" placeholder="你的答案">
            <input type="text" id="correctAnswer" placeholder="正确答案">
            <input type="text" id="subject" placeholder="学科（如：数学）">
            <input type="text" id="knowledgePoint" placeholder="知识点">
            <button onclick="addMistake()">保存错题</button>
        </div>

        <!-- 筛选 -->
        <div class="filter-box">
            按学科筛选：
            <select id="subjectFilter" onchange="loadMistakes()">
                <option value="">全部学科</option>
                <option value="数学">数学</option>
                <option value="英语">英语</option>
                <option value="语文">语文</option>
                <option value="物理">物理</option>
                <option value="化学">化学</option>
            </select>
        </div>

        <!-- 错题列表 -->
        <div class="mistake-list" id="mistakeList">
            <div class="empty">加载中...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
